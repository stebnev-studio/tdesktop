name: Snap.

on:
  push:
    # Pushes to the canary or private-ci branches run their own workflows.
    branches-ignore:
      - public-canary
      - private-canary
      - 'private-ci/**'
      - 'private-ci-*'
      - 'win7-gate-*'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/snap.yml'
      - 'Telegram/build/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.bat'
      - 'Telegram/Telegram.plist'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/snap.yml'
      - 'Telegram/build/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.bat'
      - 'Telegram/Telegram.plist'

jobs:

  snap:
    name: Ubuntu
    runs-on: ${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/nightly') && 'depot-ubuntu-latest-16' || 'ubuntu-latest' }}

    env:
      UPLOAD_ARTIFACT: "true"

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: First set up.
        run: |
          sudo iptables -P FORWARD ACCEPT
          sudo snap install --classic snapcraft
          sudo usermod -aG lxd $USER
          sudo lxd init --auto
          sudo lxd waitready

      - name: Configure disk cleanup.
        id: disk-cleanup
        run: |
          # The cleanup action uses sudo -E, which sudo-rs ignores.
          sudoers=$(mktemp)
          printf 'Defaults!%s env_keep += "INPUTS_JSON"\n' "$(command -v bash)" > "$sudoers"
          sudo visudo -cf "$sudoers"
          sudo install -m 0440 "$sudoers" /etc/sudoers.d/tdesktop-more-space

          mountpoints=/
          if mountpoint -q /mnt && [[ $(stat -c %d /mnt) != $(stat -c %d /) ]]; then
            mountpoints="/ /mnt"
          fi
          echo "mountpoints=$mountpoints" >> "$GITHUB_OUTPUT"

      - name: Free up some disk space.
        uses: samueldr/more-space-action@97048bd0df83fb05b5257887bdbaffc848887673
        with:
          enable-remove-default-apt-patterns: false
          enable-lvm-span: true
          lvm-span-mountpoint: /var/snap/lxd/common/lxd/storage-pools/default/containers
          lvm-span-mountpoints: ${{ steps.disk-cleanup.outputs.mountpoints }}

      - name: Telegram Desktop snap build.
        run: |
          lxd_storage=/var/snap/lxd/common/lxd/storage-pools/default/containers
          mountpoint "$lxd_storage"
          df -h / "$lxd_storage"
          sudo -u "$USER" snap run snapcraft --verbosity=debug

      - name: Move artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          artifact_name=$(echo telegram-desktop_*.snap)
          echo "ARTIFACT_NAME=$artifact_name" >> $GITHUB_ENV

          mkdir artifact
          mv $artifact_name artifact

      - uses: actions/upload-artifact@v7
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload artifact.
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact
          retention-days: 1
